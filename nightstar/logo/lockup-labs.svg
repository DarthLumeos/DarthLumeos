<!--
  Nightstar
  A four-point star overlapping a twelve-tooth gear.
  An eight-point star is cut out of the center: longer prongs on the
  compass points, narrower prongs on the diagonals. The gear has a
  circular hole, and a gap of the background separates every edge
  where a star point crosses the gear.
-->
